<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinAnalyzer{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Dashboard Layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }
        
        .sidebar-header {
            padding: var(--space-6);
            border-bottom: 1px solid var(--border);
        }
        
        .sidebar-nav {
            padding: var(--space-4) 0;
        }
        
        .nav-item {
            display: block;
            padding: var(--space-3) var(--space-6);
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            border-left: 3px solid transparent;
        }
        
        .nav-item:hover {
            background: var(--background);
            color: var(--text-primary);
        }
        
        .nav-item.active {
            background: var(--background);
            color: var(--primary-light);
            border-left-color: var(--primary);
        }
        
        .nav-item i {
            width: 20px;
            margin-right: var(--space-3);
        }
        
        .main-content {
            flex: 1;
            margin-left: 280px;
            background: var(--background);
        }
        
        .top-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: var(--space-4) var(--space-6);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .page-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: var(--gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .content-area {
            padding: var(--space-6);
        }
        
        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            box-shadow: var(--shadow-sm);
            height: fit-content;
        }
        
        .card canvas {
            max-height: 250px !important;
            height: 250px !important;
        }
        
        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            max-height: 250px;
            overflow: hidden;
        }
        
        .chart-container canvas {
            max-height: inherit !important;
        }
        
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-4);
        }
        
        .card-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .card-subtitle {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        
        /* Grid */
        .grid {
            display: grid;
            gap: var(--space-6);
        }
        
        .grid-cols-1 { grid-template-columns: 1fr; }
        .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
        
        /* Stats */
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            text-align: center;
        }
        
        .stat-icon {
            width: 60px;
            height: 60px;
            background: var(--gradient);
            border-radius: var(--radius-xl);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--space-4);
            font-size: var(--font-size-xl);
            color: white;
        }
        
        .stat-value {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-1);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: var(--font-size-sm);
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .mobile-menu-btn {
                display: block;
                background: none;
                border: none;
                color: var(--text-primary);
                font-size: var(--font-size-xl);
                cursor: pointer;
            }
            
            .grid-cols-2,
            .grid-cols-3,
            .grid-cols-4 {
                grid-template-columns: 1fr;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-menu-btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo" style="display: flex; align-items: center; gap: var(--space-3);">
                    <i class="fas fa-chart-line" style="color: var(--primary); font-size: var(--font-size-xl);"></i>
                    <span style="font-size: var(--font-size-lg); font-weight: 700; color: var(--text-primary);">FinAnalyzer</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item {{ 'active' if active_page == 'dashboard' else '' }}">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
                <a href="/upload" class="nav-item {{ 'active' if active_page == 'upload' else '' }}">
                    <i class="fas fa-cloud-upload-alt"></i>
                    Upload
                </a>
                <a href="/analytics" class="nav-item {{ 'active' if active_page == 'analytics' else '' }}">
                    <i class="fas fa-chart-bar"></i>
                    Analytics
                </a>
                <a href="/history" class="nav-item {{ 'active' if active_page == 'history' else '' }}">
                    <i class="fas fa-history"></i>
                    History
                </a>
                <a href="/group" class="nav-item {{ 'active' if active_page == 'group' else '' }}">
                    <i class="fas fa-users"></i>
                    Groups
                </a>
                <a href="/settings" class="nav-item {{ 'active' if active_page == 'settings' else '' }}">
                    <i class="fas fa-cog"></i>
                    Settings
                </a>
                <a href="/logout" class="nav-item" style="margin-top: var(--space-8); color: #ef4444;">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <div style="display: flex; align-items: center; gap: var(--space-4);">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                </div>
                
                <div class="user-menu">
                    <span style="color: var(--text-secondary);">Welcome, {{ user_name or 'User' }}</span>
                    <div class="user-avatar">
                        {{ (user_name or 'U')[0].upper() }}
                    </div>
                </div>
            </div>
            
            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <script>
        // Global Chart.js configuration for proper sizing
        Chart.defaults.responsive = true;
        Chart.defaults.maintainAspectRatio = false;
        Chart.defaults.plugins.legend.display = false;
        
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }
        
        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('.mobile-menu-btn');
            
            if (window.innerWidth <= 768 && 
                !sidebar.contains(e.target) && 
                !menuBtn.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
