{% extends "base.html" %}

{% block title %}History - FinAnalyzer{% endblock %}
{% block page_title %}Transaction History{% endblock %}

{% block content %}
<div class="card" style="margin-bottom: var(--space-6);">
    <div class="card-header">
        <h3 class="card-title">Filters</h3>
    </div>
    
    <div class="grid grid-cols-4" style="gap: var(--space-4);">
        <div class="form-group">
            <label class="form-label" for="typeFilter">Type</label>
            <select id="typeFilter" class="form-input">
                <option value="all">All Transactions</option>
                <option value="credit">Credit Only</option>
                <option value="debit">Debit Only</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="categoryFilter">Category</label>
            <select id="categoryFilter" class="form-input">
                <option value="all">All Categories</option>
                <option value="Food">Food & Dining</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="dateFrom">From Date</label>
            <input type="date" id="dateFrom" class="form-input">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="dateTo">To Date</label>
            <input type="date" id="dateTo" class="form-input">
        </div>
    </div>
    
    <div style="display: flex; gap: var(--space-4); margin-top: var(--space-4);">
        <button class="btn btn-primary" onclick="applyFilters()">
            <i class="fas fa-filter"></i>
            Apply Filters
        </button>
        <button class="btn btn-outline" onclick="clearFilters()">
            <i class="fas fa-times"></i>
            Clear
        </button>
        <button class="btn btn-outline" onclick="exportData()">
            <i class="fas fa-download"></i>
            Export CSV
        </button>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <h3 class="card-title">Transactions</h3>
        <div style="display: flex; align-items: center; gap: var(--space-4);">
            <span id="transactionCount" style="color: var(--text-secondary); font-size: var(--font-size-sm);">
                Loading...
            </span>
            <div class="sort-controls">
                <label style="color: var(--text-secondary); font-size: var(--font-size-sm); margin-right: var(--space-2);">Sort by:</label>
                <select id="sortBy" class="form-input" style="width: auto; padding: var(--space-2) var(--space-3);">
                    <option value="date_desc">Date (Newest First)</option>
                    <option value="date_asc">Date (Oldest First)</option>
                    <option value="amount_desc">Amount (High to Low)</option>
                    <option value="amount_asc">Amount (Low to High)</option>
                    <option value="name_asc">Name (A to Z)</option>
                </select>
            </div>
        </div>
    </div>
    
    <div id="transactionsList">
        <div style="text-align: center; color: var(--text-secondary); padding: var(--space-8);">
            <i class="fas fa-spinner fa-spin" style="font-size: var(--font-size-xl);"></i>
            <p style="margin-top: var(--space-4);">Loading transactions...</p>
        </div>
    </div>
    
    <div id="pagination" style="display: none; margin-top: var(--space-6); text-align: center;">
        <div class="pagination-controls">
            <button class="btn btn-outline" id="prevPage" onclick="changePage(-1)">
                <i class="fas fa-chevron-left"></i>
                Previous
            </button>
            <span id="pageInfo" style="margin: 0 var(--space-4); color: var(--text-secondary);"></span>
            <button class="btn btn-outline" id="nextPage" onclick="changePage(1)">
                Next
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>

<style>
    .form-group {
        margin-bottom: 0;
    }
    
    .form-label {
        display: block;
        font-weight: 500;
        margin-bottom: var(--space-2);
        color: var(--text-primary);
        font-size: var(--font-size-sm);
    }
    
    .form-input {
        width: 100%;
        padding: var(--space-3) var(--space-4);
        background: var(--background);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        color: var(--text-primary);
        font-size: var(--font-size-sm);
        transition: var(--transition);
    }
    
    .form-input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }
    
    .transaction-row {
        display: grid;
        grid-template-columns: 60px 1fr 120px 120px 100px 80px;
        gap: var(--space-4);
        align-items: center;
        padding: var(--space-4);
        border-bottom: 1px solid var(--border);
        transition: var(--transition);
    }
    
    .transaction-row:hover {
        background: var(--background);
    }
    
    .transaction-row:last-child {
        border-bottom: none;
    }
    
    .transaction-header {
        display: grid;
        grid-template-columns: 60px 1fr 120px 120px 100px 80px;
        gap: var(--space-4);
        align-items: center;
        padding: var(--space-4);
        background: var(--background);
        border-bottom: 2px solid var(--border);
        font-weight: 600;
        color: var(--text-primary);
        font-size: var(--font-size-sm);
    }
    
    .transaction-icon {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-lg);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .transaction-name {
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: var(--space-1);
    }
    
    .transaction-category {
        font-size: var(--font-size-sm);
        color: var(--text-secondary);
    }
    
    .amount-positive {
        color: #10b981;
        font-weight: 600;
    }
    
    .amount-negative {
        color: #ef4444;
        font-weight: 600;
    }
    
    .transaction-type {
        padding: var(--space-1) var(--space-3);
        border-radius: var(--radius-full);
        font-size: var(--font-size-xs);
        font-weight: 500;
        text-transform: uppercase;
    }
    
    .type-credit {
        background: rgba(16, 185, 129, 0.1);
        color: #10b981;
    }
    
    .type-debit {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
    }
    
    .pagination-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
    }
    
    .empty-state {
        text-align: center;
        color: var(--text-secondary);
        padding: var(--space-12);
    }
    
    .empty-state i {
        font-size: 3rem;
        margin-bottom: var(--space-4);
        color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
        .transaction-header,
        .transaction-row {
            grid-template-columns: 1fr;
            gap: var(--space-2);
        }
        
        .transaction-row {
            padding: var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-4);
        }
        
        .grid.grid-cols-4 {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    let allTransactions = [];
    let filteredTransactions = [];
    let currentPage = 1;
    const itemsPerPage = 20;
    
    async function loadTransactions() {
        try {
            // Load both credit and debit transactions
            const [creditResponse, debitResponse] = await Promise.all([
                fetch('/api/dashboard-data'),
                fetch('/api/dashboard-data')
            ]);
            
            const creditResult = await creditResponse.json();
            
            if (creditResult.success) {
                allTransactions = creditResult.data.recent_transactions || [];
                filteredTransactions = [...allTransactions];
                renderTransactions();
                updateTransactionCount();
            }
            
        } catch (error) {
            console.error('Error loading transactions:', error);
            showEmptyState('Error loading transactions');
        }
    }
    
    function renderTransactions() {
        const container = document.getElementById('transactionsList');
        
        if (filteredTransactions.length === 0) {
            showEmptyState('No transactions found');
            return;
        }
        
        // Sort transactions
        const sortBy = document.getElementById('sortBy').value;
        sortTransactions(sortBy);
        
        // Paginate
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageTransactions = filteredTransactions.slice(startIndex, endIndex);
        
        // Create table
        let html = `
            <div class="transaction-header">
                <div>Type</div>
                <div>Details</div>
                <div>Amount</div>
                <div>Category</div>
                <div>Date</div>
                <div>Time</div>
            </div>
        `;
        
        html += pageTransactions.map(transaction => {
            const isCredit = transaction.payment_type === 'credit';
            const icon = isCredit ? 'fa-arrow-up' : 'fa-arrow-down';
            const iconColor = isCredit ? '#10b981' : '#ef4444';
            const amountClass = isCredit ? 'amount-positive' : 'amount-negative';
            const typeClass = isCredit ? 'type-credit' : 'type-debit';
            
            return `
                <div class="transaction-row">
                    <div class="transaction-icon" style="background: ${iconColor}20;">
                        <i class="fas ${icon}" style="color: ${iconColor};"></i>
                    </div>
                    <div>
                        <div class="transaction-name">${transaction.name || 'Unknown'}</div>
                        <div class="transaction-category">${transaction.payee_type || 'Other'}</div>
                    </div>
                    <div class="${amountClass}">
                        ${isCredit ? '+' : '-'}₹${transaction.amount.toLocaleString()}
                    </div>
                    <div>
                        <span class="transaction-type ${typeClass}">
                            ${transaction.payee_type || 'Other'}
                        </span>
                    </div>
                    <div style="color: var(--text-secondary);">
                        ${new Date(transaction.date).toLocaleDateString()}
                    </div>
                    <div style="color: var(--text-secondary); font-size: var(--font-size-sm);">
                        ${transaction.time || '--:--'}
                    </div>
                </div>
            `;
        }).join('');
        
        container.innerHTML = html;
        updatePagination();
    }
    
    function sortTransactions(sortBy) {
        switch (sortBy) {
            case 'date_desc':
                filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
                break;
            case 'date_asc':
                filteredTransactions.sort((a, b) => new Date(a.date) - new Date(b.date));
                break;
            case 'amount_desc':
                filteredTransactions.sort((a, b) => b.amount - a.amount);
                break;
            case 'amount_asc':
                filteredTransactions.sort((a, b) => a.amount - b.amount);
                break;
            case 'name_asc':
                filteredTransactions.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                break;
        }
    }
    
    function showEmptyState(message) {
        const container = document.getElementById('transactionsList');
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-receipt"></i>
                <h4 style="margin-bottom: var(--space-2); color: var(--text-primary);">${message}</h4>
                <p>Try adjusting your filters or add some transactions.</p>
                <a href="/upload" class="btn btn-primary" style="margin-top: var(--space-4);">
                    <i class="fas fa-plus"></i>
                    Add Transaction
                </a>
            </div>
        `;
        document.getElementById('pagination').style.display = 'none';
    }
    
    function updateTransactionCount() {
        const count = filteredTransactions.length;
        const total = allTransactions.length;
        document.getElementById('transactionCount').textContent = 
            `Showing ${count} of ${total} transactions`;
    }
    
    function updatePagination() {
        const totalPages = Math.ceil(filteredTransactions.length / itemsPerPage);
        const pagination = document.getElementById('pagination');
        
        if (totalPages <= 1) {
            pagination.style.display = 'none';
            return;
        }
        
        pagination.style.display = 'block';
        document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('prevPage').disabled = currentPage === 1;
        document.getElementById('nextPage').disabled = currentPage === totalPages;
    }
    
    function changePage(direction) {
        const totalPages = Math.ceil(filteredTransactions.length / itemsPerPage);
        const newPage = currentPage + direction;
        
        if (newPage >= 1 && newPage <= totalPages) {
            currentPage = newPage;
            renderTransactions();
        }
    }
    
    function applyFilters() {
        const typeFilter = document.getElementById('typeFilter').value;
        const categoryFilter = document.getElementById('categoryFilter').value;
        const dateFrom = document.getElementById('dateFrom').value;
        const dateTo = document.getElementById('dateTo').value;
        
        filteredTransactions = allTransactions.filter(transaction => {
            // Type filter
            if (typeFilter !== 'all' && transaction.payment_type !== typeFilter) {
                return false;
            }
            
            // Category filter
            if (categoryFilter !== 'all' && transaction.payee_type !== categoryFilter) {
                return false;
            }
            
            // Date filters
            const transactionDate = new Date(transaction.date);
            if (dateFrom && transactionDate < new Date(dateFrom)) {
                return false;
            }
            if (dateTo && transactionDate > new Date(dateTo)) {
                return false;
            }
            
            return true;
        });
        
        currentPage = 1;
        renderTransactions();
        updateTransactionCount();
    }
    
    function clearFilters() {
        document.getElementById('typeFilter').value = 'all';
        document.getElementById('categoryFilter').value = 'all';
        document.getElementById('dateFrom').value = '';
        document.getElementById('dateTo').value = '';
        
        filteredTransactions = [...allTransactions];
        currentPage = 1;
        renderTransactions();
        updateTransactionCount();
    }
    
    function exportData() {
        if (filteredTransactions.length === 0) {
            alert('No transactions to export');
            return;
        }
        
        // Create CSV content
        const headers = ['Date', 'Time', 'Name', 'Amount', 'Type', 'Category'];
        const csvContent = [
            headers.join(','),
            ...filteredTransactions.map(transaction => [
                transaction.date,
                transaction.time || '',
                `"${transaction.name || ''}"`,
                transaction.amount,
                transaction.payment_type,
                transaction.payee_type || 'Other'
            ].join(','))
        ].join('\n');
        
        // Download CSV
        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `transactions_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
    }
    
    // Event listeners
    document.getElementById('sortBy').addEventListener('change', renderTransactions);
    
    // Set default date range (last 30 days)
    const today = new Date();
    const thirtyDaysAgo = new Date(today.getTime() - (30 * 24 * 60 * 60 * 1000));
    document.getElementById('dateTo').value = today.toISOString().split('T')[0];
    document.getElementById('dateFrom').value = thirtyDaysAgo.toISOString().split('T')[0];
    
    // Load data when page loads
    document.addEventListener('DOMContentLoaded', loadTransactions);
</script>
{% endblock %}
